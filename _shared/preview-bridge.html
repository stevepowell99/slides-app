<script>
// Cache-buster for the embedded preview ONLY. The deck preview runs inside the
// app's iframe (window.parent !== window); a Chrome "saved app" caches the
// linked stylesheets hard, so edits to styles.css / a deck's css often do not
// show even after reload, which wastes a lot of time. Here we re-point every
// local stylesheet <link> at a uniquely-queried URL on each load, so the
// browser always fetches the current CSS. Skipped when not embedded (a
// standalone or published deck), where caching is fine and links may be inlined.
(function () {
  if (window.parent === window) return; // only in the app preview
  function bust() {
    var stamp = Date.now();
    document.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
      var href = link.getAttribute("href") || "";
      if (!href || /^https?:\/\//i.test(href)) return; // leave absolute/CDN links
      link.setAttribute("href", href.split("#")[0].split("?")[0] + "?_cb=" + stamp);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bust);
  else bust();
  // The app watches the CSS files and posts this when one changes, so an edit to
  // styles.css or a deck's css restyles the live preview within a second, with no
  // reload and no loss of slide position. quarto preview only re-renders on a
  // .qmd change, so without this a CSS edit never reaches the preview.
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (d && d.source === "slide-bridge" && d.type === "reload-css") bust();
  });
})();
</script>
<script>
// Two-way bridge between the embedded Reveal deck and the parent slide app.
// Outgoing: posts `ready` (with the full slide list) once and `slidechanged`
// on every navigation. Incoming: accepts `{type:'goto', h, v}`.
//
// The rendered deck is the source of truth for slide geometry. On `ready` we
// walk Reveal's own slide collection and report each slide's real (h, v) and
// heading text, so the parent can align its parsed headings to what actually
// renders instead of guessing Quarto's layout.
(function () {
  var TAG = "slide-bridge";

  function send(type, extra) {
    if (!window.parent || window.parent === window) {
      console.log("[slide-bridge] no parent window");
      return;
    }
    var i = (typeof Reveal !== "undefined" && Reveal.getIndices) ? Reveal.getIndices() : { h: 0, v: 0 };
    var payload = Object.assign({ source: TAG, type: type, h: i.h || 0, v: i.v || 0 }, extra || {});
    console.log("[slide-bridge] postMessage:", payload);
    window.parent.postMessage(payload, "*");
  }

  // The deck's authoring size (Reveal's logical width/height). The parent uses
  // its ratio to keep the preview box a fixed slide shape while resizing.
  function revealSize() {
    var c = (typeof Reveal !== "undefined" && Reveal.getConfig) ? Reveal.getConfig() : null;
    return c ? { width: c.width, height: c.height } : {};
  }

  // Every slide Reveal will actually show, in document order, with its real
  // index and heading text. Vertical-stack wrappers are not slides, so they
  // are excluded automatically by getSlides().
  function slideList() {
    if (typeof Reveal === "undefined" || !Reveal.getSlides) return [];
    return Reveal.getSlides().map(function (el) {
      var idx = Reveal.getIndices(el) || {};
      var h = el.querySelector("h1, h2, h3, h4, h5, h6");
      return {
        id: el.id || "",
        h: idx.h || 0,
        v: idx.v || 0,
        title: h ? h.textContent.trim() : ""
      };
    });
  }

  function attach() {
    if (typeof Reveal === "undefined" || !Reveal.on || !Reveal.getIndices) {
      console.log("[slide-bridge] Reveal not ready");
      return false;
    }
    console.log("[slide-bridge] attaching to Reveal");
    Reveal.on("slidechanged", function () {
      var i = Reveal.getIndices();
      console.log("[slide-bridge] slidechanged event:", i);
      send("slidechanged");
    });
    // Re-announce the list whenever Reveal (re)lays out, e.g. after a resize
    // that collapses verticals; cheap and keeps the parent's map fresh.
    Reveal.on("ready", function () { send("ready", Object.assign({ slides: slideList() }, revealSize())); });
    send("ready", Object.assign({ slides: slideList() }, revealSize()));
    return true;
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.source !== TAG || data.type !== "goto") return;
    if (typeof Reveal === "undefined" || !Reveal.slide) return;
    var current = Reveal.getIndices();
    if ((current.h || 0) === (data.h || 0) && (current.v || 0) === (data.v || 0)) return;
    Reveal.slide(data.h || 0, data.v || 0);
  });

  var attempts = 0;
  var timer = setInterval(function () {
    attempts += 1;
    if (attach() || attempts > 100) clearInterval(timer);
  }, 80);
})();
</script>
<script>
// Section breadcrumb. Shows the title of the current `#` section slide in a
// faint corner label so you keep your place in a larger deck. Styled by
// `.slide-breadcrumb` in _shared/styles.css. Opt out per deck by setting
// `window.SLIDE_BREADCRUMB = false` before Reveal initialises.
(function () {
  if (window.SLIDE_BREADCRUMB === false) return;

  var el;

  // Title of the nearest `#` (h1) section at or before the current slide.
  // With slide-level: 2 every heading is a horizontal slide, so we scan the
  // horizontal track backwards for the last section-divider (one with an h1).
  function sectionTitle() {
    var idx = Reveal.getIndices();
    var slides = Reveal.getHorizontalSlides();
    for (var i = idx.h; i >= 0; i--) {
      var sec = slides[i];
      if (!sec || sec.id === "title-slide") continue;
      var h1 = sec.querySelector("h1");
      if (h1 && h1.textContent.trim()) return h1.textContent.trim();
    }
    return "";
  }

  function update() {
    if (!el) {
      el = document.createElement("div");
      el.className = "slide-breadcrumb";
      (document.querySelector(".reveal") || document.body).appendChild(el);
    }
    el.textContent = sectionTitle();
  }

  function attach() {
    if (typeof Reveal === "undefined" || !Reveal.on || !Reveal.getIndices) return false;
    Reveal.on("slidechanged", update);
    update();
    return true;
  }

  var n = 0;
  var t = setInterval(function () {
    n += 1;
    if (attach() || n > 100) clearInterval(t);
  }, 80);
})();
</script>
